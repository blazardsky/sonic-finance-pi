name: release-pi-zero

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git

      - uses: actions/checkout@v7

      # actions/checkout in a container writes files as a different user than
      # git expects to own them; git 2.35.2+ refuses to touch such a
      # repository (VCS status, e.g.) unless it's marked safe.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: ./scripts/build.sh

      - name: Rename binary for release
        run: cp build/api-armv6 build/sonic-finance-armv6

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: build/sonic-finance-armv6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Same asset a human would grab by hand (see docs/guides/PI_DEPLOY_GUIDE.md) — no
      # inter-job artifact plumbing, just the release the build job above
      # just published.
      - name: Download the release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ github.event.release.tag_name }} --repo ${{ github.repository }} --pattern sonic-finance-armv6

      # The Pi is on a private LAN with no public inbound port — Tailscale is
      # already running on it for other reasons (see README), so joining the
      # tailnet here is what lets this runner reach it at all.
      # A 403 "calling actor does not have enough permissions" at tailscale up
      # means the OAuth client is missing the Devices Core scope, or
      # tag:ci-deploy in tagOwners is not self-owned. Both are admin-console
      # settings (see docs/guides/PI_DEPLOY_GUIDE.md). `ping` surfaces a
      # failure against the Pi here rather than later as an ssh timeout.
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci-deploy
          ping: 100.74.171.49

      # PI_DEPLOY_SSH_KEY is restricted server-side (see authorized_keys on
      # the Pi) to running exactly one forced command — even a leaked key
      # (this repo is public) can't do anything beyond that.
      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PI_DEPLOY_SSH_KEY }}

      # accept-new trusts the Pi's host key on first connect, per run — an
      # ephemeral runner has no earlier known_hosts to compare against
      # anyway, and the connection is already inside the tailnet's own
      # encrypted, authenticated overlay.
      - name: Deploy and restart
        run: |
          ssh -o StrictHostKeyChecking=accept-new sonic@100.74.171.49 < sonic-finance-armv6
